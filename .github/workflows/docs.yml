name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The build needs nothing beyond the source. Write access to the repository
# is granted to the deploy job alone, below, so a pull request build cannot
# push to gh-pages.
permissions:
  contents: read

jobs:
  # Build on every pull request as well as on main, so a change to the docs
  # or to the toolchain in requirements.txt has to prove it still builds
  # before it lands. Without this the workflow ran only on main, which meant
  # a dependency bump had no signal at all.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install MkDocs Material + mike
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # --strict turns a broken link or an unknown config key into a failure
      # rather than a warning nobody reads.
      - name: Build the site (strict)
        run: mkdocs build --strict

  # ⛔ --strict ABOVE DOES NOT FETCH ANYTHING. It resolves links BETWEEN
  # documents and fails on an unknown config key; an https:// URL is just
  # text to it. So this repository published
  #     Path B -- Pure-UEFI loader. Lives in [`loader/`](https://github.com/cloud-boot/loader)
  # for ten weeks while that URL returned 404, because the repository had
  # never been pushed. A strict build was green throughout.
  links:
    name: every external link resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check
        run: |
          set -uo pipefail
          # The character class matters: an extractor that stops only at )
          # and " carries a closing > or < into the request.
          urls=$(grep -rhoE 'https?://[^)">< [:space:]]+' docs/ README.md | sed -E 's/[.,`]+$//' | sort -u)
          test -n "$urls" || { echo "::error::no links found; are the docs still there?"; exit 1; }
          echo "checking $(printf '%s\n' "$urls" | wc -l) distinct URLs"
          fail=0
          while read -r u; do
            # img.shields.io renders whatever it is asked for and proves nothing.
            case "$u" in
              # Renders whatever it is asked for; proves nothing.
              *img.shields.io*) continue ;;
              # Documented placeholders. keystone.example.com is what an
              # OpenStack endpoint looks like in an example, not a host.
              *example.com*|*example.org*|*example.net*|*localhost*|*127.0.0.1*|*.invalid*) continue ;;
              # 169.254.169.254 is the cloud metadata service: link-local by
              # definition, reachable only from inside an instance. Quoting it
              # is the point of the page that quotes it.
              *169.254.169.254*) continue ;;
            esac
            # Three attempts: one is a flake detector rather than a link
            # checker, and a lane that fails at random gets ignored.
            code=000
            for attempt in 1 2 3; do
              # NOT `|| echo 000`: curl prints 000 itself on a DNS failure and
              # ALSO exits non-zero, so the fallback appended a second one and
              # the report said 000000.
              code=$(curl -sS -o /dev/null -w '%{http_code}' -L --max-time 25 "$u" 2>/dev/null) || true
              code=${code:-000}
              case "$code" in 2*|3*) break ;; esac
              sleep 3
            done
            case "$code" in
              2*|3*) printf '  ok   %s  %s\n' "$code" "$u" ;;
              *)     printf '  FAIL %s  %s\n' "$code" "$u"; fail=1 ;;
            esac
          done <<< "$urls"
          test "$fail" -eq 0 || { echo "::error::at least one link does not resolve"; exit 1; }

  deploy:
    # Only main publishes. A pull request stops after build above: it has no
    # business pushing to gh-pages.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    # Never two deploys at once: mike pushes gh-pages and the second is
    # rejected outright. cancel-in-progress stays false -- killing a publish
    # half way through is worse than making it wait.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install MkDocs Material + mike
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # mike publishes versioned docs to the gh-pages branch; GitHub Pages serves
      # that branch at https://cloud-boot.github.io/docs/. The version label
      # tracks main as "0.1" aliased "latest"; tag-driven versions can be added
      # later. /docs/ redirects to the default ("latest").
      - name: Deploy versioned docs
        run: |
          git fetch origin gh-pages --depth=1 || true
          mike deploy --push --update-aliases 0.1 latest
          mike set-default --push latest
